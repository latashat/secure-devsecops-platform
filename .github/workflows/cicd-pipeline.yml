name: DevSecOps Platform Pipeline
on:
 push:
   branches:
     - main
 pull_request:
env:
 AWS_REGION: us-east-1
 ECR_REPOSITORY: secure-devsecops-platform
 IMAGE_TAG: latest
jobs:
# ------------------------------
# Code Quality & Security
# ------------------------------
 code-quality:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v3
     - name: Setup Python
       uses: actions/setup-python@v4
       with:
         python-version: 3.11
     - name: Install dependencies
       run: |
         pip install flake8 bandit
     - name: Run linting
       run: flake8 .
     - name: Run security scan
       run: bandit -r .
# ------------------------------
# Terraform Validation
# ------------------------------
 terraform-validate:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v3
     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v2
     - name: Terraform Format Check
       run: terraform fmt -check -recursive
     - name: Terraform Init
       run: terraform -chdir=terraform/environments/dev init
     - name: Terraform Validate
       run: terraform -chdir=terraform/environments/dev validate
# ------------------------------
# Terraform Security Scan
# ------------------------------
 terraform-security:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v3
     - name: Run Checkov
       run: |
         pip install checkov
         checkov -d terraform/
# ------------------------------
# Build Container Image
# ------------------------------
 build-container:
   runs-on: ubuntu-latest
   needs: [code-quality, terraform-validate]
   steps:
     - uses: actions/checkout@v3
     - name: Build Docker Image
       run: |
         docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
# ------------------------------
# Container Security Scan
# ------------------------------
 container-security:
   runs-on: ubuntu-latest
   needs: build-container
   steps:
     - uses: actions/checkout@v3
     - name: Scan container image
       run: |
         docker run --rm aquasec/trivy image $ECR_REPOSITORY:$IMAGE_TAG
# ------------------------------
# Push Image to ECR
# ------------------------------
 push-image:
   runs-on: ubuntu-latest
   needs: container-security
   steps:
     - uses: actions/checkout@v3
     - name: Configure AWS credentials
       uses: aws-actions/configure-aws-credentials@v3
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: $AWS_REGION
     - name: Login to ECR
       run: |
         aws ecr get-login-password --region $AWS_REGION \
         | docker login --username AWS --password-stdin \
         ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com
     - name: Tag Image
       run: |
         docker tag $ECR_REPOSITORY:$IMAGE_TAG \
         ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
     - name: Push Image
       run: |
         docker push \
         ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
# ------------------------------
# Deploy to Kubernetes
# ------------------------------
 deploy-dev:
   runs-on: ubuntu-latest
   needs: push-image
   steps:
     - uses: actions/checkout@v3
     - name: Configure AWS credentials
       uses: aws-actions/configure-aws-credentials@v3
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: $AWS_REGION
     - name: Update kubeconfig
       run: |
         aws eks update-kubeconfig --region $AWS_REGION --name dev-cluster
     - name: Deploy to Kubernetes
       run: |
         kubectl apply -f kubernetes/deployment.yaml