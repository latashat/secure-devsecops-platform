apiVersion: apps/v1
kind: Deployment
metadata:
 name: my-app
 labels:
   app: my-app
   tier: backend
spec:
 replicas: 3
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 1
 selector:
   matchLabels:
     app: my-app
 template:
   metadata:
     labels:
       app: my-app
       tier: backend
   spec:
     serviceAccountName: my-app-sa
     terminationGracePeriodSeconds: 30
     securityContext:
       runAsNonRoot: true
     containers:
       - name: my-app
         image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/my-app:1.0.0
         ports:
           - containerPort: 8080
         resources:
           requests:
             cpu: "250m"
             memory: "256Mi"
           limits:
             cpu: "1"
             memory: "1Gi"
         securityContext:
           allowPrivilegeEscalation: false
           readOnlyRootFilesystem: true
           capabilities:
             drop: ["ALL"]
         readinessProbe:
           httpGet:
             path: /ready
             port: 8080
         livenessProbe:
           httpGet:
             path: /health
             port: 8080
         startupProbe:
           httpGet:
             path: /health
             port: 8080
           failureThreshold: 30
           periodSeconds: 10
         envFrom:
           - configMapRef:
               name: my-app-config
           - secretRef:
               name: my-app-secrets